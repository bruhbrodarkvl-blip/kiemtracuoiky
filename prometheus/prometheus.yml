global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Prometheus Server Metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. CRM Web Application Metrics
  - job_name: 'crm-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['crm-app:5000']

  # 3. PostgreSQL Database Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 4. Nginx Reverse Proxy Exporter
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 5. cAdvisor (Container Resource Metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 6. Node Exporter (Host System Resource Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
