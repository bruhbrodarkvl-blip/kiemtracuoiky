services:
  # ==========================================================
  # TIER 1: DATABASE & STORAGE (BACKEND NETWORK)
  # ==========================================================
  crm-db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrmSecurePass_2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crm-backend-net
    # Hardening: Khong expose port 5432 ra ngoai host, gioi han tai nguyen
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 320M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # TIER 2: DATABASE ADMINISTRATION TOOL (PGADMIN 4)
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dtc245200964@ictu.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdminStrongPass_2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - crm-frontend-net
      - crm-backend-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 350M
    depends_on:
      crm-db:
        condition: service_healthy

  # ==========================================================
  # TIER 3: CORE APPLICATION (CRM FLASK + GUNICORN)
  # ==========================================================
  crm-app:
    build:
      context: ./crm-app
      dockerfile: Dockerfile
    container_name: crm-app
    restart: always
    environment:
      DB_HOST: crm-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-crm_db}
      DB_USER: ${POSTGRES_USER:-crm_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CrmSecurePass_2026!}
      SECRET_KEY: ${SECRET_KEY:-SuperSecretKey_CRM_ICTU_2026_Secure!}
    networks:
      - crm-frontend-net
      - crm-backend-net
      - crm-monitor-net
    # Hardening: Run as non-root crmuser (UID 1001) trong Dockerfile & resource limit
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      crm-db:
        condition: service_healthy

  # ==========================================================
  # TIER 4: REVERSE PROXY & GATEWAY (NGINX HTTPS)
  # ==========================================================
  crm-nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - crm-frontend-net
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    depends_on:
      - crm-app
      - pgadmin
      - grafana

  # ==========================================================
  # TIER 5: MONITORING STACK (PROMETHEUS & EXPORTERS)
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: crm-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - crm-app

  grafana:
    image: grafana/grafana:latest
    container_name: crm-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdmin_2026!
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://192.168.102.129/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - crm-frontend-net
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: crm-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-CrmSecurePass_2026!}@crm-db:5432/${POSTGRES_DB:-crm_db}?sslmode=disable"
    networks:
      - crm-backend-net
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    depends_on:
      crm-db:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: crm-nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://crm-nginx:80/stub_status
    networks:
      - crm-frontend-net
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    depends_on:
      - crm-nginx

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: crm-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
      - '--disable_metrics=disk,tcp,udp,percpu,sched,process'
    networks:
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: crm-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # ==========================================================
  # TIER 6: CENTRALIZED LOGGING (LOKI + PROMTAIL)
  # ==========================================================
  loki:
    image: grafana/loki:latest
    container_name: crm-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  promtail:
    image: grafana/promtail:latest
    container_name: crm-promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - crm-monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    depends_on:
      - loki

# ==========================================================
# HARDENING: NETWORK ISOLATION (3 TIERS)
# ==========================================================
networks:
  crm-frontend-net:
    driver: bridge
  crm-backend-net:
    driver: bridge
  crm-monitor-net:
    driver: bridge

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================
volumes:
  postgres_data: {}
  pgadmin_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  nginx_logs: {}
