version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  crm-db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrmSecurePass_2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crm-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Quản trị Cơ sở dữ liệu pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@crm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdminStrongPass_2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - crm-frontend-net
      - crm-backend-net
    depends_on:
      crm-db:
        condition: service_healthy

  # 3. Ứng dụng Web CRM (Quản lý khách hàng, liên hệ, lịch sử tương tác)
  crm-app:
    build:
      context: ./crm-app
      dockerfile: Dockerfile
    container_name: crm-app
    restart: always
    environment:
      DB_HOST: crm-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-crm_db}
      DB_USER: ${POSTGRES_USER:-crm_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CrmSecurePass_2026!}
      SECRET_KEY: ${SECRET_KEY:-SuperSecretKey_CRM_ICTU_2026_Secure!}
    networks:
      - crm-frontend-net
      - crm-backend-net
    depends_on:
      crm-db:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (HTTPS + Security Headers)
  crm-nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - crm-frontend-net
    depends_on:
      - crm-app
      - pgadmin

networks:
  crm-frontend-net:
    driver: bridge
  crm-backend-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
